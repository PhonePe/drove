name: Container Build Test

# Tests that the release container builds (and the attestation-capable
# buildx builder setup) work without tagging a release or pushing
# artifacts anywhere.
on:
  push:
    branches:
      - fix/release-buildx
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          java-version: 17
          cache: maven
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Executor jar for next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drove-executor
          path: drove-executor/target/drove-executor-*.jar
          retention-days: 1
          overwrite: true
      - name: Save Controller jar for next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drove-controller
          path: drove-controller/target/drove-controller-*.jar
          retention-days: 1
          overwrite: true

  build-containers:
    needs: build-java
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - context: drove-executor
          - context: drove-controller

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Create directories
        run: mkdir -p ${{ matrix.context }}/target

      - name: Download artifacts from build step
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.context }}
          path: ${{ matrix.context }}/target
      - name: Normalize jar name
        run: |
          cd ${{ matrix.context }}/target
          jar=$(find . -maxdepth 1 -name '*.jar' | head -n1)
          cp "$jar" ${{ matrix.context }}-0.0.0.jar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: drove-test:${{ matrix.context }}
          build-args: VERSION=0.0.0
          sbom: true
          provenance: true

      - name: Smoke test image
        run: docker image inspect drove-test:${{ matrix.context }} --format '{{ .Id }}'
