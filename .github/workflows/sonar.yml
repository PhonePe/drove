name: SonarQube and Container Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=PhonePe_drove
      - name: Save Executor jar for container build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drove-executor
          path: drove-executor/target/drove-executor-*.jar
          retention-days: 1
          overwrite: true
      - name: Save Controller jar for container build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drove-controller
          path: drove-controller/target/drove-controller-*.jar
          retention-days: 1
          overwrite: true

  containers:
    name: Container build (${{ matrix.context }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: drove-executor
          - context: drove-controller
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create directories
        run: mkdir -p ${{ matrix.context }}/target

      - name: Download jars from build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.context }}
          path: ${{ matrix.context }}/target

      - name: Normalize jar name
        run: |
          cd ${{ matrix.context }}/target
          jar=$(find . -maxdepth 1 -name '*.jar' | head -n1)
          cp "$jar" ${{ matrix.context }}-0.0.0.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        # OCI export is used instead of `load: true` because images with
        # attestations (sbom/provenance) are manifest lists, which the
        # docker exporter cannot load.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          outputs: type=oci,dest=image.tar
          tags: drove-test:${{ matrix.context }}
          build-args: VERSION=0.0.0
          sbom: true
          provenance: true

      - name: Smoke test image
        run: |
          tar -tf image.tar | grep -q '^oci-layout$'
          echo "OCI image archive OK"
